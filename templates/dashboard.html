<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js?v=20260315a"></script>
</head>

<body onload="initDashboard()">

<!-- LOGO -->
<img src="/static/img.png" class="logo">

<!-- TOP BAR -->
<div class="top-bar">

    <!-- SEARCH -->
    <div class="search-box">
        <input id="search" placeholder="Search location / item">
        <span onclick="doSearch()">🔍</span>
    </div>

    <!-- RIGHT CONTROLS -->
    <div class="right-controls">
        <div id="plc-status" class="plc-status plc-unknown">PLC: CHECKING...</div>
        <button class="reports-btn" onclick="openReports()">REPORTS</button>
        <button class="reports-btn" onclick="window.location.href='/manual-entry'">MANUAL ENTRY</button>

        <!-- LOGOUT -->
        <button class="logout-btn" onclick="logout()">LOGOUT</button>

        <!-- PAGINATION -->
        <div class="page-nav">
            <span>Page</span>
            <b id="row">1</b>

            <div class="nav-btns">
                <button onclick="prev()">⬅</button>
                <button onclick="next()">➡</button>
            </div>
        </div>

    </div>

</div>

<!-- GRID AREA -->
<div class="main">

    <div class="rack">
        <h3>Left Side</h3>
        <div id="left" class="seat-grid"></div>
    </div>

    <div class="rack">
        <h3>Right Side</h3>
        <div id="right" class="seat-grid"></div>
    </div>

</div>

<!-- OPERATION PANEL -->
<div class="operation">

    <h3>OPERATION</h3>
    <div id="sel">Select a location</div>
    <div id="op-msg"></div>

    <div class="form">
        <input id="item" placeholder="Item ID">
        <input id="desc" placeholder="Description">
    </div>

    <div class="material-wrap">
        <div class="material-title">Quick Material Type</div>
        <div class="material-types">
            <button id="type-a" class="type-btn" onclick="setMaterialType('TYPE_A')">Type A</button>
            <button id="type-b" class="type-btn" onclick="setMaterialType('TYPE_B')">Type B</button>
            <button id="type-c" class="type-btn" onclick="setMaterialType('TYPE_C')">Type C</button>
        </div>
    </div>

    <button id="inward-btn" class="btn green" onclick="inward()">RUN INWARD</button>
    <button id="outward-btn" class="btn red" onclick="outward()">RUN OUTWARD</button>

</div>

</body>
</html>
